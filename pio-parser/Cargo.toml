[package]
name = "pio-parser"
version = "0.4.0"
authors = ["snek", "The rp-rs Developers"]
edition = "2021"
resolver = "2"
description = "Raspberry Silicon PIO asm parser"
license = "MIT"
repository = "https://github.com/rp-rs/pio-rs"

[dependencies]
lalrpop-util = { version = "0.23.2", default-features = false, features = ["lexer", "unicode"] }
pio-core = { path = "../pio-core", version = "0.4.0" }
arrayvec = { version = "0.7", default-features = false }
logos = "0.16"
thiserror = "2"
itertools = "0.15"

[build-dependencies]
lalrpop = { version = "0.23.2", default-features = false, features = ["unicode", "lexer"]}
