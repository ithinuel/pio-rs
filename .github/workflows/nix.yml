name: nix

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly, so the flake gets exercised even without pushes.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Flake check
        run: nix flake check
      - name: Git hooks
        run: nix develop --command pre-commit run --all-files
      - name: Tests
        run: nix develop --command cargo test --workspace
